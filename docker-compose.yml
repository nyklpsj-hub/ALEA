# Alea — full local stack: PostgreSQL+pgvector, FastAPI, Next.js.
#
#   cp .env.example .env      # fill in LLM_API_KEY
#   docker compose up --build
#
# The API runs migrations and indexes the knowledge base on start, so the first
# boot is also the whole setup.

name: alea

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: alea
      POSTGRES_PASSWORD: alea
      POSTGRES_DB: alea
    ports:
      # Same host port as scripts/local_postgres.py, so one .env works either way.
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alea -d alea"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Inside the compose network the database is reachable by service name.
      DATABASE_URL: postgresql+asyncpg://alea:alea@db:5432/alea
      CHECKPOINT_DATABASE_URL: postgresql://alea:alea@db:5432/alea
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
