name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: alea
          POSTGRES_PASSWORD: alea
          POSTGRES_DB: alea
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U alea"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      ALEA_REQUIRE_DB: "1"
      ALEA_TEST_PG_PORT: "55432"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests scripts

      - name: Type check
        run: mypy app

      - name: Tests
        # No LLM_API_KEY is provided, so the `llm`-marked tests skip themselves.
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
